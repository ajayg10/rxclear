AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: RXCLEAR – AI-powered prescription analysis platform.

Parameters:
  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock inference profile ID for prescription OCR analysis.
  BedrockRegion:
    Type: String
    Default: ap-south-1
    Description: AWS region for Bedrock API calls.
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Frontend origin for CORS headers.

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - x86_64
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  # ─── S3 Bucket ──────────────────────────────────────────────
  PrescriptionUploads:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfterOneDay
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1

  # ─── DynamoDB Tables ────────────────────────────────────────
  DrugInteractionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: interactionKey
          AttributeType: S
      KeySchema:
        - AttributeName: interactionKey
          KeyType: HASH

  SubmissionHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ─── Upload Handler Lambda ─────────────────────────────────
  UploadHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
    Properties:
      CodeUri: ../backend/
      Handler: functions/upload-handler/index.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          SUBMISSION_HISTORY_TABLE: !Ref SubmissionHistoryTable
          UPLOAD_BUCKET: !Ref PrescriptionUploads
          FRONTEND_ORIGIN: !Ref FrontendOrigin
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref SubmissionHistoryTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${PrescriptionUploads}/*"
      Events:
        Upload:
          Type: Api
          Properties:
            Path: /upload
            Method: post

  # ─── Analyze Rx Lambda (triggered by S3) ────────────────────
  AnalyzeRxFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
    Properties:
      CodeUri: ../backend/
      Handler: functions/analyze-rx/index.handler
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref BedrockRegion
          DRUG_INTERACTIONS_TABLE: !Ref DrugInteractionsTable
          SUBMISSION_HISTORY_TABLE: !Ref SubmissionHistoryTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DrugInteractionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionHistoryTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: "arn:aws:s3:::*/*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        PrescriptionUploaded:
          Type: S3
          Properties:
            Bucket: !Ref PrescriptionUploads
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  # ─── Get Analysis Lambda ────────────────────────────────────
  GetAnalysisFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
    Properties:
      CodeUri: ../backend/
      Handler: functions/get-analysis/index.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          SUBMISSION_HISTORY_TABLE: !Ref SubmissionHistoryTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionHistoryTable
      Events:
        Analysis:
          Type: Api
          Properties:
            Path: /analysis/{submissionId}
            Method: get

Outputs:
  ApiEndpoint:
    Description: REST API endpoint URL.
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  UploadBucketName:
    Description: Private bucket for temporary prescription image uploads.
    Value: !Ref PrescriptionUploads
